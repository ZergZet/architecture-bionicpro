x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
    args:
      AIRFLOW_UID: 50000
  image: local/airflow-custom:2.9.3
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW_CONN_CRM_DB: 'postgresql://crm_user:crm_pass@postgres-crm:5432/crm'
    AIRFLOW_CONN_TELEMETRY_DB: 'postgresql://telemetry_user:telemetry_pass@postgres-telemetry:5432/telemetry'
    CLICKHOUSE_HOST: 'clickhouse'
    CLICKHOUSE_PORT: '8123'
    CLICKHOUSE_USER: 'default'
    CLICKHOUSE_PASSWORD: ''
    CLICKHOUSE_DATABASE: 'mart'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:

  postgres-crm:
    image: postgres:16
    container_name: postgres-crm
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm
    volumes:
      - crm_data:/var/lib/postgresql/data
      - ./init/crm:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-telemetry:
    image: postgres:16
    container_name: postgres-telemetry
    restart: unless-stopped
    environment:
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_pass
      POSTGRES_DB: telemetry
    volumes:
      - telemetry_data:/var/lib/postgresql/data
      - ./init/telemetry:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-airflow:
    image: postgres:16
    container_name: postgres-airflow
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: mart
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-keycloak:
    image: postgres:14
    container_name: postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    container_name: keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_PROXY: edge
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    depends_on:
      postgres-keycloak:
        condition: service_started

  reports:
    build:
      context: ./reports
      dockerfile: Dockerfile
    image: local/reports:1.0.0
    container_name: reports
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: 'clickhouse'
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: 'default'
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DATABASE: 'mart'
      KEYCLOAK_INTERNAL_URL: 'http://keycloak:8080'
      KEYCLOAK_PUBLIC_URL: 'http://localhost:8081'
      KEYCLOAK_REALM: 'reports-realm'
    ports:
      - "8001:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
      keycloak:
        condition: service_started

  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    image: local/reports-bff:1.0.0
    container_name: bff
    restart: unless-stopped
    environment:
      PORT: '8000'
      KEYCLOAK_INTERNAL_URL: 'http://keycloak:8080'
      KEYCLOAK_PUBLIC_URL: 'http://localhost:8081'
      REALM: 'reports-realm'
      CLIENT_ID: 'reports-bff'
      CLIENT_SECRET: 'bff-secret-change-me'
      REDIRECT_URI: 'http://localhost:8000/auth/callback'
      FRONTEND_URL: 'http://localhost:3000'
      REPORTS_API_URL: 'http://reports:8000'
      SESSION_SECRET: 'change-me-in-prod'
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_started
      reports:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BFF_URL: http://localhost:8000
    image: local/reports-frontend:1.0.0
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      bff:
        condition: service_started

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs /opt/airflow/plugins
        airflow db migrate
        airflow users create \
          --username admin --firstname Admin --lastname Admin \
          --role Admin --email admin@example.com --password admin || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  crm_data:
  telemetry_data:
  airflow_db:
  clickhouse_data:
  keycloak_db: